<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Product Showcase</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>College Product Showcase</h1>
        <p>Automatic Product Slideshow</p>
    </header>

    <div class="container">

        <div class="slide-header">
            <div id="slideInfo"></div>
            <div id="timer"></div>
        </div>

        <div id="productContainer"></div>

        <div class="buttons">
            <button id="previousBtn">← Previous</button>
            <button id="nextBtn">Next →</button>
        </div>

    </div>

    <footer>
        © 2026 College Product Showcase
    </footer>

    <script src="script.js"></script>

</body>

</html>
